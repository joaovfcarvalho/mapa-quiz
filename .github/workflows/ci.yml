# Testes dos motores e invariantes dos dados (node:test, sem dependências).
name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxe dos scripts
        run: npm run check
      - name: Testes
        run: npm test
