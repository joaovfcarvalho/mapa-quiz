<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz do Mapa do Brasil</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🗺️ Quiz do Mapa do Brasil</h1>
  <button id="btn-recordes" class="botao-sec" type="button">🏆 Recordes</button>
</header>

<main>
  <aside id="painel">
    <nav id="abas-modo">
      <button class="aba ativa" data-modo="dist" type="button">Círculos<br>por distância</button>
      <button class="aba" data-modo="pop" type="button">Círculos<br>por população</button>
      <button class="aba" data-modo="faixas" type="button">Faixas<br>do mapa</button>
    </nav>
    <p id="descricao-modo"></p>

    <form id="config" autocomplete="off">
      <div class="config-modo" data-modo="dist">
        <label>Raio do círculo (km)
          <input type="number" id="cfg-dist-raio" value="100" min="10" max="2000" step="10">
        </label>
        <label>Limite da partida
          <select id="cfg-dist-limite" class="sel-limite">
            <option value="palpites">Nº de palpites</option>
            <option value="tempo">Tempo (palpites ilimitados)</option>
          </select>
        </label>
        <label id="rotulo-dist-palpites">Número de palpites
          <input type="number" id="cfg-dist-palpites" value="10" min="1" max="100">
        </label>
        <label id="rotulo-dist-tempo" hidden>Tempo (minutos)
          <input type="number" id="cfg-dist-tempo" value="30" min="1" max="240">
        </label>
        <label>Objetivo
          <select id="cfg-dist-metrica">
            <option value="pop">Cobrir população</option>
            <option value="cidades">Cobrir número de cidades</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="cfg-dist-homonimos">
          Nome ambíguo marca todas as homônimas
        </label>
      </div>

      <div class="config-modo" data-modo="pop" hidden>
        <label>População por círculo (hab.)
          <input type="number" id="cfg-pop-alvo" value="1000000" min="10000" max="100000000" step="50000">
        </label>
        <label>Limite da partida
          <select id="cfg-pop-limite" class="sel-limite">
            <option value="palpites">Nº de palpites</option>
            <option value="tempo">Tempo (palpites ilimitados)</option>
          </select>
        </label>
        <label id="rotulo-pop-palpites">Número de palpites
          <input type="number" id="cfg-pop-palpites" value="10" min="1" max="100">
        </label>
        <label id="rotulo-pop-tempo" hidden>Tempo (minutos)
          <input type="number" id="cfg-pop-tempo" value="30" min="1" max="240">
        </label>
        <label class="check">
          <input type="checkbox" id="cfg-pop-homonimos">
          Nome ambíguo marca todas as homônimas
        </label>
      </div>

      <div class="config-modo" data-modo="faixas" hidden>
        <label>Tipo de faixa
          <select id="cfg-faixas-tipo">
            <option value="lat">Faixas de latitude</option>
            <option value="lng">Faixas de longitude</option>
            <option value="aneis">Anéis concêntricos</option>
          </select>
        </label>
        <label>Largura de cada faixa (km)
          <input type="number" id="cfg-faixas-largura" value="300" min="50" max="2000" step="50">
        </label>
        <label>Maiores cidades por faixa
          <input type="number" id="cfg-faixas-topn" value="3" min="1" max="10">
        </label>
        <label id="rotulo-centro" hidden>Centro dos anéis (cidade)
          <input type="text" id="cfg-faixas-centro" value="Brasília, DF">
        </label>
        <label>Limite de tempo
          <select id="cfg-faixas-limite" class="sel-limite">
            <option value="livre">Sem limite</option>
            <option value="tempo">Contra o relógio</option>
          </select>
        </label>
        <label id="rotulo-faixas-tempo" hidden>Tempo (minutos)
          <input type="number" id="cfg-faixas-tempo" value="30" min="1" max="240">
        </label>
      </div>
    </form>

    <div id="recorde-atual"></div>
    <button id="btn-iniciar" class="botao-pri" type="button">▶ Iniciar jogo</button>

    <section id="area-jogo" hidden>
      <div class="barra"><div id="barra-progresso"></div></div>
      <div id="placar-linhas"></div>
      <div id="linha-palpite">
        <input type="text" id="input-palpite" placeholder="Digite uma cidade… (ex.: Campinas ou Bom Jesus, RS)" autocomplete="off" spellcheck="false">
        <button id="btn-palpitar" class="botao-pri" type="button">OK</button>
      </div>
      <div id="feedback"></div>
      <div id="fim-jogo" hidden></div>
      <button id="btn-encerrar" class="botao-sec" type="button">🏳️ Encerrar / revelar respostas</button>
      <div id="lista-jogo"></div>
    </section>
  </aside>

  <div id="mapa-wrap">
    <svg id="mapa" role="img" aria-label="Mapa do Brasil"></svg>
    <button id="btn-satelite" type="button"
      title="Alternar fundo de satélite (imagem: NASA Blue Marble)">🛰️ Satélite</button>
    <div id="dica-zoom">roda do mouse: zoom · arrastar: mover · duplo clique: restaurar</div>
    <div id="tooltip" hidden></div>
  </div>
</main>

<div id="modal-recordes" class="modal" hidden>
  <div class="modal-caixa">
    <div class="modal-topo">
      <h2>🏆 Recordes pessoais</h2>
      <button id="btn-fechar-recordes" class="botao-sec" type="button">✕</button>
    </div>
    <p class="modal-nota">Os recordes ficam salvos neste navegador (localStorage), um por configuração de jogo.</p>
    <div id="lista-recordes"></div>
    <button id="btn-limpar-recordes" class="botao-sec" type="button">Apagar todos os recordes</button>
  </div>
</div>

<script src="data/municipios.js"></script>
<script src="data/brasil_uf.js"></script>
<script src="js/geo.js"></script>
<script src="js/dados.js"></script>
<script src="js/recordes.js"></script>
<script src="js/modos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
